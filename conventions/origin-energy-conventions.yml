pagination:
- surface: Kraken GraphQL
  style: cursor (Relay connections)
  params:
  - first
  - after
  - last
  - before
  response_fields:
  - pageInfo.startCursor
  - pageInfo.endCursor
  - pageInfo.hasNextPage
  - pageInfo.hasPreviousPage
  - edges
  - node
  max_page_size: 100
  note: The docs state the first argument must be set to a value less than 100, and that hasPreviousPage
    returns false when paginating forward with after. 94 *Connection types exist in the schema.
  errors:
