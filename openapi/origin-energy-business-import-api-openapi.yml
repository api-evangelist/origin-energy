    CustomerAlternativeNumber:
      type: object
      properties:
        phone_number:
          type:
          - string
          - 'null'
          default: ''
          description: <p>A customer's alternative phone number.</p>
          maxLength: 32
          x-validators:
          - name: Validate phone number
            description: Validates that a phone number conforms to the norms of the region from which the migration is taking place.
            possible_errors:
            - invalid_phone_number
    CharacteristicOverrideConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicOverride'
          description: <p>The characterisctics associated with the characterisctic override.</p>
      required:
      - overrides
      - term_type
    DelayerDays:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        days:
          type: integer
          minimum: 1
          description: <p>The number of days between when a reactive payment is triggered and when it should be taken.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        strategy:
          enum:
          - FIXED
          - WORKING_DAYS
          type: string
          x-spec-enum-id: b62f1d43e0839f86
          description: <p>The strategy used to count the delayer days.</p>
          x-enum-descriptions:
            FIXED: Calendar days
            WORKING_DAYS: Working days
      required:
      - days
      - strategy
      - term_type
    BespokeRateSchedule:
      type: object
      properties:
        identifier:
          type:
          - string
          - 'null'
          description: <p>A unique identifier for the bespoke rate schedule.</p>
        items:
          type: array
          items:
            $ref: '#/components/schemas/BespokeRateItem'
          description: <p>A list of bespoke rates.</p>
          minItems: 1
          x-validators:
          - name: Validate bespoke rate items are unique
            description: Validate that no two bespoke rate items in a schedule share the same rate specification code, rate specification type, and variant profile.
            possible_errors:
            - duplicate_bespoke_rate_items
        product_code:
          type: string
          description: <p>A product code for the schedule of bespoke rate.</p>
          x-validators:
          - name: Validate product code exists
            description: Validate that the product code exists in Kraken.
            possible_errors:
            - product_code_does_not_exist
        supply_point_identifier:
          type:
          - string
          - 'null'
          description: <p>The external identifier of the supply point that this bespoke rate schedule targets.</p>
          minLength: 1
        valid_from:
          type: string
          format: date-time
          description: <p>The date the schedule of bespoke rates is valid from (inclusive).</p>
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
          description: <p>The date the schedule of bespoke rates is valid to (exclusive).</p>
      required:
      - items
      - product_code
      - valid_from
      x-validators:
      - name: Validate <code>⁨valid_to⁩</code> not before or equal to <code>⁨valid_from⁩</code>
        description: Validates that <code>⁨valid_to⁩</code>, if given, is strictly later than ⁨valid_from⁩.
        possible_errors:
        - start_date_same_as_end_date
      - name: Validate each item represents a possible rate for the product
        description: Validate each item's rate specification, characteristic values, and scheme labels represent a rate defned on the product.
        possible_errors:
        - characteristic_code_not_found
        - invalid_characteristic_value
        - invalid_profile_variant_for_specification
        - product_specification_not_found_for_product
        - rate_specification_not_found_for_product
        - shared_rate_not_found
        - shared_rate_not_found_for_product
      - name: Validate that all required bespoke rates are present and no non-overridable rates are supplied
        description: Validates that bespoke rate schedules include all rate specifications marked as must-be-overridden and mandatory, and do not include any rate specifications marked as cannot-be-overridden.
        possible_errors:
        - bespoke_rate_cannot_be_overridden
        - missing_required_bespoke_rate
    PaysByDirectDebitTerm:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        pays_by_direct_debit:
          type: boolean
          description: <p>Whether the customer pays by direct debit.</p>
      required:
      - pays_by_direct_debit
      - term_type
    BillingDocumentIssuanceFrequencyTerm:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        frequency:
          enum:
          - DAILY
          - MONTHLY
          type: string
          x-spec-enum-id: 74dcc34556834abd
          description: <p>The rate at which a billing document is issued. For example, this can be daily or monthly.</p>
          x-enum-descriptions:
            DAILY: Daily
            MONTHLY: Monthly
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        multiplier:
          type: integer
          description: <p>The multiplier for the issuance frequency. For example, for a frequency of monthly and a multiplier of 2, a billing document should be issued every 2 months.</p>
        period_start_day:
          type: integer
          description: <p>The day of the month on which the billing period starts in Kraken.</p>
        period_start_month:
          type: integer
          description: <p>The month of the year on which the billing period starts in Kraken.</p>
      required:
      - frequency
      - multiplier
      - period_start_day
      - period_start_month
      - term_type
