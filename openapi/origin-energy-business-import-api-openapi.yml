openapi: 3.2.0
info:
  title: Kraken Business Import API
  version: v1
  description: APIs for importing businesses with business contracts
servers:
- url: https://api.origin-kraken.energy/v1
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: business_import
  x-title: Business Import
  description: APIs for importing businesses with business contracts
  x-documentation-order: 2
paths:
  /v1/data-import/business/:
    post:
      operationId: V1 Create Business
      description: Use this endpoint to import business to Kraken.
      summary: Import business to Kraken
      tags:
      - business_import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessImportProcess'
        required: true
      security:
      - DataImportViewerAPIKeyAuthentication: []
      - DRFKrakenTokenAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessImportProcessCreation'
              examples:
                SuccessfulBusinessImport:
                  value:
                    kraken_business_id: Business ID
                  summary: Successful business import
          description: The business has been successfully imported in Kraken.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DRFError'
          description: '

            If there are validation errors, they will be detailed in the body

            of the response. To resolve these errors, refer to the field definitions

            and validation rules.


            '
      x-doc-alerts: []
components:
  schemas:
    PromotionAssignmentSchedule:
      type: object
      properties:
        discount_targets:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PromotionAssignmentTarget'
          description: <p>Mapping of discount code to a list of targets the discount applies to.</p>
        params:
          type: object
          description: '<p>Optional parameters for the promotion assignment schedule. Supports the following keys: <code>promotion_start_date</code> — an ISO 8601 datetime string (e.g. <code>2024-01-15T00:00:00+00:00</code>) that overrides the date used when calculating promotion eligibility (e.g. months since sign-up). If omitted, the date is derived from the customer''s agreement.</p>'
        promotion_code:
          type: string
          description: <p>The promotion code to apply.</p>
      required:
      - discount_targets
      - promotion_code
      x-validators:
      - name: Promotion assignment discount targets are valid
        description: Validates that the promotion exists, discounts are defined in the promotion, target types match the discount target type, and target identifiers are valid.
        possible_errors:
        - discount_not_in_promotion
        - invalid_input_data
        - promotion_not_registered
        - rate_source_provider_not_registered
        - source_data_not_supported_for_fixed_rate
        - source_data_reference_mismatch
        - target_identifier_invalid
        - target_type_mismatch
        - target_type_not_registered
      - name: Promotion assignment params are valid
        description: Validates that the params field contains only valid values. If promotion_start_date is provided, it must be a valid ISO 8601 datetime string.
        possible_errors:
        - invalid_promotion_start_date
    AusEEPAExportContractedVolumeConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        periods:
          type: array
          items:
            $ref: '#/components/schemas/AusEEPAExportContractedVolumePeriod'
          description: <p>A list of EEPA export contracted volume periods.</p>
          minItems: 1
          x-validators:
          - name: Validate EEPA export contracted volume periods
            description: 'Validate that the EEPA export contracted volume periods form a valid term: no overlapping general periods, and no supply point repeated across overlapping periods.'
            possible_errors:
            - invalid_eepa_export_contracted_volume
      required:
      - periods
      - term_type
    PartnerOrganisation:
      type: object
      properties:
        organisation_number:
          type: string
          description: <p>Identifier of the partner organisation.</p>
          maxLength: 128
          x-validators:
          - name: Validate <code>organisation_number</code>
            description: Validate that the given <code>organisation_number</code> has a corresponding organisation registered in the database.
            possible_errors:
            - partner_organisation_does_not_exist
        role:
          enum:
          - G_LOA
          type: string
          x-spec-enum-id: 7e197ea5273e96fb
          description: <p>The type of role the partner organisation plays.</p>
          x-enum-descriptions:
            G_LOA: General Letter of Authority
        source_reference_s3_key:
          type: string
          description: <p>The s3 key of the partner file attachment that governs this organisation relationship.</p>
        valid_from:
          type: string
          format: date-time
          description: <p>The beginning of the validity period of this organisation relationship.</p>
        valid_to:
          type: string
          format: date-time
          description: <p>The end of the validity period of this organisation relationship.</p>
      required:
      - organisation_number
      - role
      - valid_from
      - valid_to
      x-validators:
      - name: Validate <code>⁨valid_to⁩</code> not before <code>⁨valid_from⁩</code>
        description: Validates that <code>⁨valid_to⁩</code>, if given, is on or later than <code>⁨valid_from⁩</code>.
        possible_errors:
        - start_date_later_than_end_date
    ContractVersion:
      type: object
      properties:
        applicable_at_date:
          type: string
          format: date
          description: <p>The date on which this contract version become applicable at.</p>
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Terms'
          description: <p>The terms for this version of the contract.</p>
      required:
      - applicable_at_date
      - terms
    TrancheTargetResidualFeeMarket:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,8})?$
          description: <p>Residual fee amount</p>
        market_name:
          type: string
          description: <p>The market the residual fee applies to</p>
        unit:
          type: string
          description: <p>Residual fee unit</p>
      required:
      - amount
      - market_name
      - unit
    PromotionAssignmentTarget:
      type: object
      properties:
        displayed_on_bill:
          type: boolean
          default: true
          description: <p>Whether this discount should be displayed as a line item on customer bills. Defaults to <code>true</code>. Set to <code>false</code> to hide the discount from bills while still applying it.</p>
        identifier:
          type: string
          description: <p>The identifier for the target. Format is <code>&lt;product_specification_identifier&gt;:&lt;specification_code&gt;</code> (e.g., for rate specifications or shared rates).</p>
        source_data:
          type: object
          description: '<p>Optional configuration data used by rate providers to resolve discount rates. The structure depends on the rate provider (e.g., <code>&#123;"bespoke_amount": "0.05"&#125;</code> for bespoke rates).</p>'
        target_type:
          type: string
          description: <p>The type of target being discounted. Use <code>rate_specification</code> to target a product catalog rate specification, or <code>shared_rate</code> to target a shared rate.</p>
      required:
      - identifier
      - target_type
    CardAndBankAccountPaymentInstruction:
      type: object
      properties:
        bank_account:
          allOf:
          - $ref: '#/components/schemas/PaymentInstructionBankAccount'
          description: <p>Bank account payment instruction details.</p>
        card:
          allOf:
          - $ref: '#/components/schemas/PaymentInstructionCard'
          description: <p>Card payment instruction details.</p>
        customer_reference:
          type: string
          description: <p>The customer reference of the payment instruction.</p><p>Although not required for payment instructions to take payments, if provided it keeps Kraken's data in sync with the customer's account in the payment vendor's systems.</p>
          maxLength: 512
        instruction_identifier:
          type: string
          description: <p>Unique identifier for the payment instruction. Used for cross referencing the payment instruction within other parts of the payload.</p>
        ledger_code:
          type: string
          description: <p>The code of the relevant Kraken ledger type for the payment instruction. This code must exist in Kraken.</p>
          x-validators:
          - name: Validate ledger code
            description: Validates that the ledger code provided in the payload matches an available ledger type in Kraken.
            possible_errors:
            - ledger_code_does_not_exist
        reference:
          type: string
          description: <p>The reference of the mandate as known by the vendor.</p>
          maxLength: 512
        type:
          enum:
          - BPAY
          - CARD
          - CUSTOM
          - DIRECT_DEBIT
          - GMO_REFUND
          - PAYMENT_SLIP
          type: string
          x-spec-enum-id: 601d0b035869d4dd
          description: <p>The payment type of the payment instruction.</p>
          x-enum-descriptions:
            BPAY: BPAY
            CARD: Card
            CUSTOM: Custom
            DIRECT_DEBIT: Direct Debit
            GMO_REFUND: GMO Refund
            PAYMENT_SLIP: Payment slip
        use_for_scheduled_payments:
          type: boolean
          description: <p>Whether this payment instruction should be used for scheduled payments on a given ledger. If true, this instruction will be set as the payment method for the account's payment schedule.</p>
        valid_from:
          type:
          - string
          - 'null'
          format: date
          description: <p>The date from which the payment instruction is valid.</p>
        vendor:
          enum:
          - WESTPAC
          type: string
          x-spec-enum-id: 19baa89b6ef9d00c
          description: <p>The vendor for the payment instruction.</p>
          x-enum-descriptions:
            WESTPAC: Westpac
      required:
      - reference
      - type
      - vendor
      x-validators:
      - name: null
        description: null
        possible_errors:
        - incomplete_payments_not_enabled
      - name: Validate card details are provided for card payment instruction
        description: Validate that if the payment instruction is of type CARD then card payment details are provided in the payload. This may not be enforced if client is using cashflow instructions as card details are obtained from the vendor in this case.
        possible_errors:
        - card_details_not_provided_for_card_payment_instruction
    RateGroupEligibilityConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/RateGroupEligibilitySchedule'
          description: <p>Rate group eligibility schedules.</p>
        time_series_specification_schedules:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesSpecificationEligibilitySchedule'
          description: <p>Shared rate eligibility schedules.</p>
      required:
      - schedules
      - term_type
      - time_series_specification_schedules
    BusinessContract:
      type: object
      properties:
        identifier:
          type: string
          description: <p>The contract's unique identifier.</p>
          x-validators:
          - name: Validates that a contract with the given identifier does not exist
            description: Validates that there is not an existing contract in Kraken with the same identifier provided in the payload.
            possible_errors:
            - contract_with_identifier_exists
        sales_record:
          allOf:
          - $ref: '#/components/schemas/ContractSalesRecord'
          description: <p>Sales record details about the contract.</p>
        signed_at_date:
          type: string
          format: date
          description: <p>The date on which the contract was signed.</p>
        valid_from_date:
          type: string
          format: date
          description: '<p>The date from which the contract is valid. This is an inclusive date. Example: If <code>valid_from</code> is October 1, 2024, then the contract is valid on October 1, 2024 and following dates.</p>'
        valid_to_date:
          type:
          - string
          - 'null'
          format: date
          description: '<p>The date on which the contract expires. This is an exclusive date. Example: If <code>valid_to</code> is October 1, 2025, then the contract is not valid on October 1, 2025 or following dates.</p>'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ContractVersion'
          description: <p> The versions of this contract, each version is a collection of terms and the date they are applicable. Only two versions can be provided, one which starts on the same date as the contract is valid from and one other future dated version to be scheduled.</p>
      required:
      - identifier
      - signed_at_date
      - valid_from_date
      x-validators:
      - name: Validate that contract versions include a version for the current terms
        description: Validate that the earliest version in the list of contract versions provided has an <code>applicable_at_date</code> that is equal to the contract <code>valid_from_date</code>.
        possible_errors:
        - contract_versions_does_not_include_current
    VariantProfile:
      type: object
      properties:
        characteristic_values:
          type: object
          description: <p>A dictionary of characteristic values which the rate applies to.</p>
          x-validators:
          - name: Validate provided dictionary content types
            description: Validates that provided dictionary contents are of the specified key type and value type.
            possible_errors: []
        scheme_labels:
          type: object
          description: <p>A dictionary of scheme labels which the rate applies to.</p>
          x-validators:
          - name: Validate provided dictionary content types
            description: Validates that provided dictionary contents are of the specified key type and value type.
            possible_errors: []
          - name: Validate that scheme labels have the correct format
            description: Validate that scheme labels have the the following format 'scheme-type:identifier' where 'scheme-type' is one of 'time_of_use', 'register'.
            possible_errors:
            - invalid_scheme_label_format
    BusinessPortfolio:
      type: object
      properties:
        billing_name:
          type: string
          description: <p>Optional billing name to be used on the account. If provided, it will be used for producing statements. If not, the customer names will be used.</p>
          maxLength: 510
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          description: <p>List of notes that should be applied at the portfolio level instead of the individual account.</p>
        portfolio_references:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioReference'
          description: <p>List of references to the portfolio that this account belongs to.</p>
          minItems: 1
        portfolio_settings:
          allOf:
          - $ref: '#/components/schemas/PortfolioSettings'
          description: <p>This object allows for setting portfolio settings during data migration. This object is only available where the <code>is_portfolio_lead</code> flag is true. Any other account type will fail validation.</p>
      required:
      - portfolio_references
      x-validators:
      - name: Validate portfolio reference provided correctly
        description: Validate that a portfolio reference is provided if portfolio settings have been provided and that a portfolio reference is not provided if the import supplier is set to create new portfolios.
        possible_errors:
        - portfolio_references_missing
        - portfolio_references_provided
      - name: Validate no duplicate portfolio reference namespaces
        description: Validate that there are no duplicate portfolio reference namespaces in the payload.
        possible_errors:
        - duplicate_portfolio_references
    LatePaymentFees:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        flat_fee_amount:
          type: integer
          minimum: 0
          description: <p>The flat amount added to each late payment fee, in the lowest denomination for the currency.</p>
        interest_policy_name:
          enum:
          - ''
          - RBA
          type: string
          x-spec-enum-id: 755d70bd45dbabbb
          description: <p>The interest policy to use for late payment fee calculations.</p>
          x-enum-descriptions:
            ? ''
            : '---------'
            RBA: RBA
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        percentage_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: <p>The percentage fee to be applied as part of the late payment fee calculations.</p>
        percentage_interval_days:
          type: integer
          minimum: 0
          description: <p>The interval the percentage fee rate represents in days (365 = annual).</p>
      required:
      - flat_fee_amount
      - percentage_fee
      - percentage_interval_days
      - term_type
    BusinessImportProcess:
      type: object
      properties:
        business:
          allOf:
          - $ref: '#/components/schemas/BusinessWithContracts'
          description: <p>The business's information</p>
        external_business_identifier:
          type: string
          description: <p>The unique identifier of a business in the external system. This id is used to link an imported business in Kraken to the external system</p>
          maxLength: 128
        import_supplier_code:
          enum:
          - ORIGIN_SOLARFLEX_INACTIVE
          - ORIGIN
          - WIN_CONNECT_PARENT
          - ORIGIN_CNI
          - ORIGIN_BUSINESS
          - WIN_CONNECT
          - ORIGIN_SOLARFLEX
          - ORIGIN_BUSINESS_NO_CONTRACT
          type: string
          x-spec-enum-id: 9572ea198e3a9787
          description: The code of an existing ImportSupplier in the database.
          x-enum-descriptions:
            ORIGIN_SOLARFLEX_INACTIVE: Origin SolarFlex Inactive
            ORIGIN: Origin
            WIN_CONNECT_PARENT: Win Connect Parent
            ORIGIN_CNI: Origin CNI
            ORIGIN_BUSINESS: Origin Zero Business Import Supplier
            WIN_CONNECT: WinConnect
            ORIGIN_SOLARFLEX: Origin SolarFlex
            ORIGIN_BUSINESS_NO_CONTRACT: Origin Business - No Contracts e.g. trustee
      required:
      - business
      - external_business_identifier
      - import_supplier_code
    PortfolioReference:
      type: object
      properties:
        namespace:
          enum:
          - external-portfolio-reference-id
          - portfolio-label
          type: string
          x-spec-enum-id: 9c7783add2be9a67
          description: <p>The namespace refers to the particular context the reference exists in. This must be one of the following options below if a portfolio reference is being provided.</p>
          x-enum-descriptions:
            external-portfolio-reference-id: external-portfolio-reference-id
            portfolio-label: portfolio-label
        value:
          type: string
          description: <p>The unique identifier for the portfolio.</p>
          maxLength: 100
      required:
      - namespace
      - value
    TimeSeriesSpecificationEligibilitySchedule:
      type: object
      properties:
        effective_period:
          allOf:
          - $ref: '#/components/schemas/EffectivePeriod'
          description: <p>The effective period of the schedule.</p>
        is_eligible:
          type: boolean
          description: <p>Whether the rate group is eligible for charging to the customer.</p>
        product_code:
          type: string
          description: <p>Product code. </p>
          x-validators:
          - name: Validate product code exists
            description: Validate that the product code exists in Kraken.
            possible_errors:
            - product_code_does_not_exist
        supply_point_identifier:
          type: string
          description: <p>Optional supply point identifier to restrict this schedule to a specific supply point.</p>
        time_series_specification_code:
          type: string
          description: <p>The unique shared rate code for the product.</p>
      required:
      - effective_period
      - is_eligible
      - product_code
      - time_series_specification_code
      x-validators:
      - name: data-import--validation--shared-rate-exists-for-product
        description: Validate that the shared rate code provided matches the shared rate for the product with the provided product code.
        possible_errors:
        - product_specification_not_found_for_product
        - time_series_not_found_for_product
    BespokeRateConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not. If not, it must be amended by a new contract.</p>
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/BespokeRateSchedule'
          description: <p>The schedules of bespoke rates.</p>
          minItems: 1
          x-validators:
          - name: Validate bespoke rates do not conflict
            description: Validate bespoke rates for the same target and rate do not conflict during the same period. The target of a bespoke rate is determined by the supply point identifier and product code.
            possible_errors:
            - overlapping_bespoke_rate_schedules
          - name: Validate bespoke rate schedules target consistently
            description: Validate that bespoke rate schedules either all target supply points via the supply_point_identifier field or none do.
            possible_errors:
            - inconsistent_bespoke_rate_schedule_targeting
      required:
      - schedules
      - term_type
    BusinessImportProcessCreation:
      type: object
      properties:
        external_business_identifier:
          type: string
          description: <p>The unique identifier of a business in the external system. This id is used to link an imported business in Kraken to the external system</p>
        kraken_business_id:
          type: integer
          description: <p>The unique identifier of a business in Kraken. This id can be used to identify a business in Kraken</p>
    PartnerCommissionConfig:
      type: object
      properties:
        apply_uplift:
          type: boolean
          default: false
          description: <p>Whether to apply a product uplift for this partner commission. Defaults to <code>false</code>.</p>
        override_trailing_percentage:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: <p>Optional override for the trailing commission percentage. Overrides the default percentage on the partner commission.</p>
        override_unit_amount:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,8})?$
          description: <p>Optional override for the unit-based commission rate. Overrides the default unit amount on the partner commission.</p>
        partner_commission_number:
          type: string
          description: <p>The unique identifier of the partner commission (e.g. <code>OPC-XXXXXXXX</code> or <code>TPC-XXXXXXXX</code>).</p>
          maxLength: 20
      required:
      - partner_commission_number
    PaymentInstructionCard:
      type: object
      properties:
        card_payment_network:
          enum:
          - MASTERCARD
          - VISA
          - AMEX
          - JCB
          - DISCOVER
          - DANKORT
          type: string
          x-spec-enum-id: c8ed471949510265
          description: <p>The card payment network for the payment instruction.</p>
          x-enum-descriptions:
            MASTERCARD: Mastercard
            VISA: Visa
            AMEX: American Express
            JCB: JCB
            DISCOVER: Discover
            DANKORT: Dankort
        card_type:
          enum:
          - CREDIT
          - DEBIT
          - PREPAID
          type: string
          x-spec-enum-id: 90bbc4bed8c0c0e8
          description: <p>The card type for the payment instruction.</p>
          x-enum-descriptions:
            CREDIT: Credit
            DEBIT: Debit
            PREPAID: Prepaid
        expiry_month:
          type: integer
          maximum: 12
          minimum: 1
          description: <p>The expiry month of the card in MM format.</p>
        expiry_year:
          type: integer
          minimum: 1000
          description: <p>The expiry year of the card in YYYY format.</p>
        last_digits:
          type: string
          description: <p>The last 3 or 4 digits of the card number.</p>
          pattern: ^[0-9]{3,4}$
      required:
      - card_payment_network
      - card_type
    BespokeRateItem:
      type: object
      properties:
        identifier:
          type:
          - string
          - 'null'
          description: <p>A unique identifier for the bespoke rate item.</p>
        price_per_unit:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,8})?$
          description: <p>The price per unit of the bespoke rate.</p>
        rate_specification_code:
          type: string
          description: <p>The rate specification code for the bespoke rate.</p>
        rate_specification_type:
          enum:
          - PRODUCT_RATE
          - SHARED_RATE
          - null
          type:
          - string
          - 'null'
          x-spec-enum-id: 94c4191a865cda34
          default: PRODUCT_RATE
          description: <p>The rate specification type for the bespoke rate.</p>
          x-enum-descriptions:
            PRODUCT_RATE: Product rate
            SHARED_RATE: Shared rate
            None: None
        variant_profile:
          allOf:
          - $ref: '#/components/schemas/VariantProfile'
          description: <p>The variant profile which the rate applies to.</p>
      required:
      - price_per_unit
      - rate_specification_code
      - variant_profile
    CharacteristicOverride:
      type: object
      properties:
        characteristic_code:
          type: string
          description: <p>The code for the characteristic.</p>
        override_value:
          description: <p>The override value for the characteristic.</p>
        product_code:
          type:
          - string
          - 'null'
          description: <p>Optional product code. If specified, the override applies only to this product.</p>
          x-validators:
          - name: Validate product code exists
            description: Validate that the product code exists in Kraken.
            possible_errors:
            - product_code_does_not_exist
      required:
      - characteristic_code
      - override_value
      x-validators:
      - name: Validate characterisctic code exist
        description: Validate that the characterisctic code exists in Kraken.
        possible_errors:
        - characteristic_code_not_found
      - name: null
        description: null
        possible_errors:
        - invalid_characteristic_for_product
    IndexationOption:
      type: object
      properties:
        escalation_start_date:
          type: string
          format: date
