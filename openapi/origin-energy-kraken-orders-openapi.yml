      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/OrderAccount'
          description: <p>A list of account targets for the order.</p>
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/OrderBusiness'
          description: <p>A list of business targets for the order.</p>
