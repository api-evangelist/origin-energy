    BespokeRateConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not.
            If not, it must be amended by a new contract.</p>
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/BespokeRateSchedule'
          description: <p>The schedules of bespoke rates.</p>
          minItems: 1
          x-validators:
          - name: Validate bespoke rates do not conflict
            description: Validate bespoke rates for the same target and rate do not
              conflict during the same period. The target of a bespoke rate is determined
              by the supply point identifier and product code.
            possible_errors:
            - overlapping_bespoke_rate_schedules
          - name: Validate bespoke rate schedules target consistently
            description: Validate that bespoke rate schedules either all target supply
              points via the supply_point_identifier field or none do.
            possible_errors:
            - inconsistent_bespoke_rate_schedule_targeting
      required:
      - schedules
      - term_type
    BespokeRateItem:
      type: object
      properties:
        identifier:
          type: string
          nullable: true
          description: <p>A unique identifier for the bespoke rate item.</p>
        price_per_unit:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,8})?$
          description: <p>The price per unit of the bespoke rate.</p>
        rate_specification_code:
          type: string
          description: <p>The rate specification code for the bespoke rate.</p>
        rate_specification_type:
          enum:
          - PRODUCT_RATE
          - SHARED_RATE
          - null
          type: string
          x-spec-enum-id: 94c4191a865cda34
          nullable: true
          default: PRODUCT_RATE
          description: <p>The rate specification type for the bespoke rate.</p>
          x-enum-descriptions:
            PRODUCT_RATE: Product rate
            SHARED_RATE: Shared rate
            None: None
        variant_profile:
          allOf:
          - $ref: '#/components/schemas/VariantProfile'
          description: <p>The variant profile which the rate applies to.</p>
      required:
      - price_per_unit
      - rate_specification_code
      - variant_profile
    BespokeRateSchedule:
      type: object
      properties:
        identifier:
          type: string
          nullable: true
          description: <p>A unique identifier for the bespoke rate schedule.</p>
        items:
          type: array
          items:
            $ref: '#/components/schemas/BespokeRateItem'
          description: <p>A list of bespoke rates.</p>
          minItems: 1
          x-validators:
          - name: Validate bespoke rate items are unique
            description: Validate that no two bespoke rate items in a schedule share
              the same rate specification code, rate specification type, and variant
              profile.
            possible_errors:
            - duplicate_bespoke_rate_items
        product_code:
          type: string
          description: <p>A product code for the schedule of bespoke rate.</p>
          x-validators:
          - name: Validate product code exists
            description: Validate that the product code exists in Kraken.
            possible_errors:
            - product_code_does_not_exist
        supply_point_identifier:
          type: string
          nullable: true
          description: <p>The external identifier of the supply point that this bespoke
            rate schedule targets.</p>
          minLength: 1
        valid_from:
          type: string
          format: date-time
          description: <p>The date the schedule of bespoke rates is valid from (inclusive).</p>
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: <p>The date the schedule of bespoke rates is valid to (exclusive).</p>
      required:
      - items
      - product_code
      - valid_from
      x-validators:
      - name: Validate <code>⁨valid_to⁩</code> not before or equal to <code>⁨valid_from⁩</code>
        description: Validates that <code>⁨valid_to⁩</code>, if given, is strictly
          later than ⁨valid_from⁩.
        possible_errors:
        - start_date_same_as_end_date
      - name: Validate each item represents a possible rate for the product
        description: Validate each item's rate specification, characteristic values,
          and scheme labels represent a rate defned on the product.
        possible_errors:
        - characteristic_code_not_found
        - invalid_characteristic_value
        - invalid_profile_variant_for_specification
        - product_specification_not_found_for_product
        - rate_specification_not_found_for_product
        - shared_rate_not_found
        - shared_rate_not_found_for_product
      - name: Validate that all required bespoke rates are present and no non-overridable
          rates are supplied
        description: Validates that bespoke rate schedules include all rate specifications
          marked as must-be-overridden and mandatory, and do not include any rate
          specifications marked as cannot-be-overridden.
        possible_errors:
        - bespoke_rate_cannot_be_overridden
        - missing_required_bespoke_rate
    BillDueDate:
