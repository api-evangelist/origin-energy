openapi: 3.0.3
info:
  title: Kraken
  version: v1
paths:
  /v2/orders/:
    post:
      operationId: V2 Schedule Order
      description: Use this endpoint to schedule the placement of an order in Kraken.
        It accepts a request containing the necessary information for order placement,
        validates the data, and creates an order management task to be executed asynchronously.
      summary: Schedule the placement of an order in Kraken
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOrder'
            examples:
              ExamplePayload:
                value:
                  external_order_id: ORD-12345678
                  accounts:
                  - type: EXISTING
                    account_identifier: acc-ref-001
                    account_number: A-12345678
                  businesses:
                  - type: EXISTING
                    business_identifier: biz-ref-001
                    company_name: Tentacle Corp
                    company_number: '12345678'
                    business_type: LTD
                  order_lines:
                  - type: CONTRACT_RENEWAL
                    target_type: BUSINESS
                    target_reference: biz-ref-001
                    contract:
                      identifier: contract-001
                      valid_from_date: '2026-01-01'
                      signed_at_date: '2025-12-15'
                      valid_to_date: '2027-01-01'
                      versions: []
                      subjects:
                      - type: ACCOUNT
                        identifier: acc-ref-001
                summary: Example payload
        required: true
      security:
      - DataImportViewerAPIKeyAuthentication: []
      - DRFKrakenTokenAuthentication: []
      responses:
        '201':
          description: The payload has been successfully scheduled.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardizedValidationErrorResponse'
              examples:
                ScheduleOrderValidationErrorResponse:
                  value:
                    code: order_process_failed_validation
                    detail: Order payload validation failed.
                    domain: order_process
                  summary: Schedule order validation error response
                  description: If there are validation errors, a 400 Bad Request response
                    will be returned detailing the errors. To resolve these errors,
                    refer to the field definitions and validation rules.
                ScheduleOrderErrorResponse:
                  value:
                    non_field_errors:
                      detail: The order with external order ID ORD-12345678 has already
                        been processed.
                      code: order_process_already_processed
                  summary: Schedule order error response
                  description: If an order has already been processed, a 400 Bad Request
                    response will be returned.
          description: Validation errors occurred while processing the request.
      x-doc-alerts: []
  /v2/orders/{external_order_id}/:
    get:
      operationId: V2 Order Status
      description: Use this endpoint to retrieve the current status of an order. The
        order is identified by its external_order_id.
      summary: Return the status of an order process
      parameters:
      - in: path
        name: external_order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - DataImportViewerAPIKeyAuthentication: []
      - DRFKrakenTokenAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusResponse'
              examples:
                OrderStatusSuccessResponse(processed):
                  value:
                    status: PROCESSED
                    created_at: '2025-04-17T00:00:00Z'
                    modified_at: '2025-04-17T01:00:00Z'
                    latest_error: null
                    latest_event:
                      event: ORDER_PROCESS_SUCCEEDED
                      occurred_at: '2025-04-17T01:00:00Z'
                      data: null
                  summary: Order status success response (processed)
                  description: A successful response for an order that has been processed.
                OrderStatusSuccessResponse(errored):
                  value:
                    status: ERRORED
                    created_at: '2025-04-17T00:00:00Z'
                    modified_at: '2025-04-17T01:30:00Z'
                    latest_error:
                      code: validation_error
                      detail: Account number is invalid
                      domain: accounts
                    latest_event:
                      event: ORDER_PROCESS_ERRORED
                      occurred_at: '2025-04-17T01:30:00Z'
                      data:
                        code: validation_error
                        detail: Account number is invalid
                        domain: accounts
                  summary: Order status success response (errored)
                  description: A successful response for an order that has errored
                    during processing.
          description: The status of the order.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                OrderNotFoundResponse:
                  value:
                    detail: The requested resource was not found.
                    code: not_found
                  summary: Order not found response
                  description: Returned when no order process exists for the given
                    external_order_id.
          description: Order not found for the given external_order_id.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidOrderProcessStatusResponse:
                  value:
                    detail: 'Order process has no status set for external_order_id:
                      example-order-id'
                    code: invalid_status_for_order_process
                  summary: Invalid order process status response
                  description: Returned when the order process has an invalid or missing
                    status.
          description: The order process has an invalid or missing status.
      x-doc-alerts: []
components:
  schemas:
    AccountReference:
      type: object
      properties:
        namespace:
          type: string
          description: <p>The namespace refers to the particular context the reference
            exists in. For example, <code>tentacle-energy.allpay-client-reference-numbers</code>.</p>
          maxLength: 50
          x-validators:
          - name: Validate account reference namespace
            description: Validate that the account reference namespace matches an
              available account reference namespace in Kraken.
            possible_errors:
            - invalid_reference_namespace
        value:
          type: string
          description: <p>The unique identifier for the account.</p>
          maxLength: 100
      required:
      - namespace
      - value
      x-validators:
      - name: Validate account reference does not already exist
        description: Validate that the account reference does not already exist for
          any account in Kraken.
        possible_errors:
        - reference_already_exists
    Address:
      type: object
      properties:
        administrative_area:
          type: string
          default: ''
          description: <p>The top-level administrative subdivision. For example a
            US state, Australian state/territory, Italian region, UK constituent nation
            or Japanese prefecture.</p>
          maxLength: 512
        country:
          type: string
          description: <p>The ISO 3166-1-alpha-2 code of the country that this address
            belongs to, for example AU (Australia) or GB (Great Britain).</p>
          maxLength: 2
        delivery_point_identifier:
          type: string
          description: <p>The unique country specific identifier for an address. For
            example the UPRN in the UK or G-NAF ID in Australia.</p>
          maxLength: 11
          x-validators:
          - name: Validate delivery point identifier
            description: Validate that the delivery point identifier contains only
              capital letters and numbers.
            possible_errors:
            - invalid_delivery_point_identifier
        dependent_locality:
          type: string
          default: ''
          description: <p>Dependent localities, neighbourhoods or boroughs. These
            are sometimes included in an address when the delivery point is outside
            the boundary of the main postal town that serves it.</p>
          maxLength: 512
        locality:
          type: string
          default: ''
          description: <p>The city/town portion of an address. For example a US city,
            Australian suburb/town, Italian comune or UK postal town.</p>
          maxLength: 512
        name:
          type: string
          default: ''
          description: <p>The recipient's name.</p>
          deprecated: true
        organization:
          type: string
          default: ''
          description: <p>The company or organization to which the address belongs.</p>
          deprecated: true
        postal_code:
          type: string
          default: ''
          description: <p>The code assigned to a geographical area representing a
            group of addresses. For example a US ZIP code, Australian postcode, Italian
            CAP code or UK postcode.</p>
          maxLength: 512
        sorting_code:
          type: string
          default: ''
          description: <p>This is a non-geographic code used for recipients of large
            quantities of post, such as companies or government departments. An example
            is the French CEDEX code.</p>
          maxLength: 512
        street_address:
          type: string
          default: ''
          description: <p>Free text field for the address. Either this field or the
            <code>structured_address</code> field should be provided, not both.</p>
        structured_street_address:
          type: object
          nullable: true
          description: <p>Structured address object. Fields for this object are territory
            dependent. Please speak to the tech team about uses of this field. Either
            this field or the <code>street_address</code> should be provided, not
            both.</p>
      required:
      - country
      x-validators:
      - name: Validate and normalize postcode
        description: Validate the postal code and normalize it to a standard format.
        possible_errors:
        - invalid_postcode
      - name: Validate address
        description: Validate that the address is in the correct format.
        possible_errors:
        - invalid_address
    AgreementIntermediaryDetails:
      type: object
      properties:
        external_id:
          type: string
          nullable: true
          description: <p>An external identifier for the intermediary relationship.
            This can be used to store a reference to this relationship in an external
            system (e.g., the source system during migration).</p>
          maxLength: 255
        portfolio_number:
          type: string
          description: <p>The number of the intermediary portfolio to link this agreement
            to. The portfolio must exist before creating the agreement.</p>
          x-validators:
          - name: Validate the portfolio number
            description: Validate that the portfolio number matches the expected format
              (P- followed by 8 uppercase alphanumeric characters).
            possible_errors:
            - invalid_portfolio_number
      required:
      - portfolio_number
    AusAgreementAddOn:
      type: object
      properties:
        code:
          type: string
          description: <p>Code for addon that must have been configured for the product
            in kraken.</p>
          x-validators:
          - name: data-import--validation--contract-addon-has-valid-code--display-name
            description: data-import--validation--contract-addon-has-valid-code--help-text
            possible_errors:
            - addon_code_not_found
      required:
      - code
    AusEEPAExportContractedVolumeConfiguration:
      type: object
      properties:
        term_type:
          type: string
          description: <p>The type of the contract term.</p>
        is_variable:
          type: boolean
          default: true
          description: <p>Whether the contract term is variable in Kraken or not.
            If not, it must be amended by a new contract.</p>
        periods:
          type: array
          items:
            $ref: '#/components/schemas/AusEEPAExportContractedVolumePeriod'
          description: <p>A list of EEPA export contracted volume periods.</p>
          minItems: 1
          x-validators:
          - name: Validate EEPA export contracted volume periods
            description: 'Validate that the EEPA export contracted volume periods
              form a valid term: no overlapping general periods, and no supply point
              repeated across overlapping periods.'
            possible_errors:
            - invalid_eepa_export_contracted_volume
      required:
      - periods
      - term_type
    AusEEPAExportContractedVolumePeriod:
      type: object
      properties:
        supply_point_external_identifiers:
          type: array
          items:
            type: string
          nullable: true
          description: <p>The external identifiers (NMIs) of the supply points this
            period applies to. Leave null to apply to all supply points not covered
            by a more specific period; when provided the list must not be empty.</p>
          minItems: 1
        unit:
          type: string
          description: <p>The unit for the contracted export volume (e.g. kWh).</p>
        valid_from_date:
          type: string
          format: date
          description: <p>The date the period is valid from (inclusive).</p>
        valid_to_date:
          type: string
          format: date
          description: <p>The date the period is valid to (exclusive; the period ends
            before this date).</p>
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,4})?$
          description: <p>The contracted export volume cap for the period.</p>
      required:
      - supply_point_external_identifiers
      - unit
      - valid_from_date
      - valid_to_date
      - value
      x-validators:
      - name: Convert supply point external identifiers to IDs
        description: Convert each supply point external identifier (NMI) to the internal
          supply point ID by looking up the supply point in the database. A null value
          is left unchanged and applies the period to all supply points.
        possible_errors:
        - supply_point_not_found
      - name: Validate <code>⁨valid_to⁩</code> not before <code>⁨valid_from⁩</code>
        description: Validates that <code>⁨valid_to⁩</code>, if given, is on or later
          than <code>⁨valid_from⁩</code>.
        possible_errors:
        - start_date_later_than_end_date
    AusElectricityAgreement:
      type: object
      properties:
        market_name:
          enum:
          - AUS_ELECTRICITY
          type: string
          x-spec-enum-id: 497cd6e4782e8889
          description: <p>The market name of the supply point.</p>
          x-enum-descriptions:
            AUS_ELECTRICITY: AUS_ELECTRICITY
        account_reference:
          type: string
          description: <p>The identifier of the account that owns this supply point.
            Must match one of the contract's subject accounts.</p>
        agreed_at:
          type: string
          format: date-time
          nullable: true
          description: <p>The datetime the agreement was agreed at.</p>
        business_contract_identifier:
          type: string
          nullable: true
          description: <p>The identifier of the business contract this agreement should
            be linked to.</p>
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristic'
          nullable: true
          description: <p>Characteristics of the agreed product that the customer
            has chosen.</p>
          x-validators:
          - name: Validate that each child has unique values for the <code>⁨code⁩</code>
              field
            description: Validate that each child has unique values for the <code>⁨code⁩</code>
              field.
            possible_errors:
            - children_with_duplicate_values
        effective_from:
          type: string
          format: date
          description: <p>The date from which the agreement is effective (inclusive),
            i.e. the agreement starts on the midnight of this date, such that this
            date becomes the first day covered by this agreement.</p>
        effective_to:
          type: string
          format: date
          nullable: true
          description: <p>The date to which the agreement is effective (exclusive),
            i.e. the agreement will end on the midnight of this date, such that the
            previous day is the last day covered by this agreement.</p>
        intermediary:
          allOf:
          - $ref: '#/components/schemas/AgreementIntermediaryDetails'
          nullable: true
          description: <p>Details about the intermediary relationship for this agreement.
            When provided, an intermediary link will be created between the agreement
            and the portfolio, establishing a business intermediary relationship.</p>
        product_addons:
          type: array
          items:
            $ref: '#/components/schemas/AusAgreementAddOn'
          nullable: true
          description: <p>A list of product addons that apply to the specific agreement.</p>
        rate_overrides:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
          description: <p>Agreement rate overrides.</p>
        rates_agreed_at:
          type: string
          format: date-time
          nullable: true
          description: <p>The datetime the rates were agreed at.</p>
        supply_point_identifier:
          type: string
          description: <p>The identifier of the supply point to add the agreement
            to.</p>
        tariff_code:
          type: string
          description: <p>The code for the agreement tariff. Must match an existing
            tariff code of an active product.</p>
          x-validators:
          - name: Validate product code exists
            description: Validate that the product code exists in Kraken.
            possible_errors:
            - product_code_does_not_exist
      required:
      - account_reference
      - effective_from
      - market_name
      - supply_point_identifier
      - tariff_code
      x-validators:
      - name: Validate <code>⁨effective_to⁩</code> not before <code>⁨effective_from⁩</code>
