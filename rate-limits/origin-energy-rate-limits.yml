name: Origin Energy rate limits
generated: '2026-10-20'
method: searched
source: https://developer.origin-kraken.energy/graphql/guides/basics/
docs: https://developer.origin-kraken.energy/graphql/guides/basics/
limit_count: 7
note: Published usage constraints for the Origin Energy Kraken GraphQL API (re-read 2026-10-20, "Pagination"
  and "Usage constraints" sections of API basics). Limits are signalled in the GraphQL errors[] envelope
  by Kraken error codes (KT-CT-1188, KT-CT-1189, KT-CT-1199), not by X-RateLimit-* / Retry-After headers;
  the docs name no rate-limit response headers. The current allowance and remaining balance are readable
  via the rateLimitInfo query. The REST API (api.origin-kraken.energy/v1/) publishes no separate numeric
  limits. Consumer Data Right surfaces are governed by the Consumer Data Standards non-functional requirements,
  not by Origin.
signaling:
  headers: []
  error_codes:
  - {code: KT-CT-1188, meaning: total complexity of a request exceeds the limit}
  - {code: KT-CT-1189, meaning: Query exceeds maximum allowed node count}
  - {code: KT-CT-1199, meaning: too many requests (request-specific rate limit)}
  introspection: rateLimitInfo query
limits:
- name: Query complexity per request
  max: 550
  unit: complexity points
  window: per request
  scope: per-request
  error_code: KT-CT-1188
  limit_text: The complexity limit for a single request is 550
- name: Nodes per request
  max: 100000
  unit: nodes
  window: per request
  scope: per-request
  error_code: KT-CT-1189
  limit_text: 100,000 nodes per request
- name: Account user hourly points allowance (default)
  max: 50000
  unit: points
  window: 1 hour
  scope: per-account-user
  limit_text: 'Account users : 50,000 points'
  note: Default value; configurable via the Kraken Hub and scaled with the number of supply points managed.
- name: Organisation hourly points allowance (default)
  max: 100000
  unit: points
  window: 1 hour
  scope: per-organisation
  limit_text: 'Organisations : 100,000 points'
  note: Default value; configurable via the Kraken Hub.
- name: OAuth application hourly points allowance (default)
  max: 300000
  unit: points
  window: 1 hour
  scope: per-oauth-application
  limit_text: 'OAuth applications : 300,000 points'
- name: Request-specific rate limiting (static / dynamic)
  scope: per-ip-or-viewer
  error_code: KT-CT-1199
  limit_text: Request-specific rate limits restrict the number of calls which can be made from the same
    IP address, user or other identifying factor within a specific period of time.
  note: Per-field thresholds are not published; the docs' "100 requests per minute" and "5 times within
    a minute" figures are illustrative examples, not stated limits. Dynamic limits do not reset automatically.
- name: Paginated field page size
  max: 100
  unit: records
  window: per request
  scope: per-request
  limit_text: the first argument is set to a value less than 100
cdr:
  note: Consumer Data Right traffic thresholds are set in the Consumer Data Standards (non-functional
    requirements), not by Origin Energy.
  docs: https://consumerdatastandardsaustralia.github.io/standards/#non-functional-requirements
