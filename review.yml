notFabricated:
  statement: >-
    Nothing in this profile was inferred, generated or assumed. Every host was
    resolved, every URL was requested, every status code above was observed, and
    every stored document was fetched and parsed. Where something could not be
    verified it is recorded as not verified rather than asserted.
  explicitlyNotFound:
  - A self-serve developer signup of any kind, on any Origin or Kraken host.
  - >-
    Any Origin-published AsyncAPI document or Postman collection. (Corrected
    2026-07-27: OpenAPI and a GraphQL SDL ARE obtainable — three OpenAPI 3.0.3
    documents are served anonymously from the Kraken schema endpoints and the
    full GraphQL SDL is obtainable by anonymous introspection. Origin does not
    publish them as downloadable files, but they are machine-readable and
    anonymously retrievable, and all four are now stored in this repo.)
  - Any first-party SDK or client library in npm, PyPI, RubyGems or crates.io.
  - Any MCP server on any Origin or Kraken host.
  - Any trust centre, certification page or published compliance program.
  - Any open data portal, dataset catalogue or data licence page on an Origin domain.
  - Any documented public API for the Origin Loop virtual power plant.
  - Any documented public API for Origin's EV charging or solar products.
  - Any Green Button, ESPI, OpenADR, IEEE 2030.5, IEC CIM, OCPP or OCPI reference.
  - >-
    Any anonymously readable OIDC discovery document for the CDR InfoSec
    endpoints; the InfoSec base URI is not published in the public CDR Register
    summary and was not guessed.

context:
  sectorArchitecture: >-
    The CDR energy sector is a two-holder design and this matters when reading
    Origin. The retailer is the primary data holder for accounts, billing,
    invoices and plans; AEMO is the designated secondary data holder for
    metering and NMI standing data and acts as the gateway for standardised
    retailer data. AEMO does not appear in the energy data-holder brands
    summary, which is consistent with it being a secondary holder rather than a
    brand.
  registerShape: >-
    The register lists 84 energy brands. Roughly 50 of them do not run any CDR
    infrastructure at all and point their publicBaseUri at
    cdr.energymadeeasy.gov.au/<brand>, the AER's hosted gateway. The large
    retailers — Origin, AGL, EnergyAustralia, ENGIE, Alinta, Red, Momentum,
    Amber — run their own. The mandate was replicable, but the cost of the
    implementation was not, and the regulator ended up hosting the long tail.
  platformDependency: >-
    Origin runs its retail business on Kraken, Octopus Energy's platform, and
    holds an equity stake in Octopus Energy and in Kraken Technologies. The
    Kraken tenancy at origin-kraken.energy is therefore both Origin's operating
    system and the reason Origin has any readable developer documentation at
    all. The API a developer can actually read at Origin is not Origin's — it is
    its vendor's, wearing Origin's stylesheet.
  theFinding: >-
    Australia proved a statutory data mandate is transplantable between sectors.
    At Origin the transplant took: the register entry, the certificate authority
    and the conformant endpoints are all real. What the transplant did not carry
    across is any notion of developer access. Sixteen years of API practice would
    call this a compliance surface, not a product — mandated, verified, working,
    and reachable by almost nobody.
