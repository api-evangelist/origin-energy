bridge:
  note: 'The CDR model is a regulated projection of the Kraken model: the 113 Kraken OAuth scopes (view:detailed-usage,
    request:consumption-data, query:electricity-meter-point-details, submit:meter-readings) describe the
    same consumer energy data that the Consumer Data Standards expose as EnergyAccount, EnergyServicePoint
    and EnergyUsageRead.'
