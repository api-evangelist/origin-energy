apis:
- aid: origin-energy:origin-energy-cdr-energy-api
  name: Origin Energy CDR Energy API
  description: >-
    Origin Energy's Consumer Data Right energy data holder resource endpoint,
    serving the Consumer Data Standards energy APIs (accounts, invoices,
    billing, balances, concessions, payment schedules, electricity service
    points, usage and DER) to accredited data recipients acting on a consumer's
    consent. Verified live on 2026-07-27: the host presents a TLS certificate
    with subject "OU=Consumer Data Right, O=Origin Energy,
    CN=api.mydata.cdr.originenergy.com.au, C=AU" issued by "CDR Intermediate CA
    2025" under the Australian Competition and Consumer Commission's CDR Root
    CA, and resets the connection when no client certificate is presented — the
    mandate is implemented and the gate is mutual TLS plus CDR accreditation.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#energy-apis
  baseURL: https://api.mydata.cdr.originenergy.com.au
