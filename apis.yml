- aid: origin-energy:origin-energy-kraken-events
  name: Origin Energy Kraken External Events
  description: >-
    Origin's publicly readable Kraken External Events reference, cataloguing
    several hundred versioned event types emitted by the platform. Confirmed
    HTTP 200 on 2026-07-27. The catalogue is explicitly Australian-market
    shaped, carrying National Electricity Market industry events such as
    aus.industry.electricity.cats_notification.received-v1,
    aus.industry.electricity.register.network_tariff_code.changed-v1,
    aus.industry.electricity.life_support_request.received-v1 and
    aus.electricity.move-in.completed-v1 alongside generic account, agreement
    and approval events. The machine-readable schema endpoint
    (https://api.origin-kraken.energy/external-events/schema/) returned HTTP 403
    anonymously, so no event contract could be harvested.
  humanURL: https://developer.origin-kraken.energy/events/
  tags:
  - Kraken
