- aid: origin-energy:origin-energy-plan-reference-data-api
  name: Origin Energy Plan Reference Data API (AER Energy Made Easy)
  description: >-
    Origin Energy's retail electricity and gas plan reference data, exposed
    under the Consumer Data Standards Get Generic Plans and Get Generic Plan
    Detail endpoints. Hosted by the Australian Energy Regulator's Energy Made
    Easy CDR gateway rather than on an Origin host — Origin's own public base
    URI returns 404 for /cds-au/v1/energy/plans. Verified anonymously on
    2026-07-27: the plans list returned HTTP 200 with x-v:1 reporting 3,595
    Origin plan records, and plan detail returned HTTP 200 with x-v:3 (x-v:1
    is rejected with an UnsupportedVersion error). No key, no signup, no
    consent required.
  humanURL: https://www.energymadeeasy.gov.au/
  baseURL: https://cdr.energymadeeasy.gov.au/origin/cds-au/v1
