- aid: origin-energy:origin-energy-kraken-rest-api
  name: Origin Energy Kraken REST API
  description: >-
    The REST half of the Kraken platform API that Origin Energy runs its retail
    business on, documented at Origin's own publicly readable Kraken developer
    portal and described as available to "customers and partner organisations".
    Base URL https://api.origin-kraken.energy/v1/. The Redoc reference is driven
    from live OpenAPI 3.0.3 documents served at
    https://api.origin-kraken.energy/v1/schema, /data-import/schema/ and
    /v2/orders/schema/, all of which returned HTTP 200 anonymously on 2026-07-27
    and are harvested verbatim here — covering ad-hoc account payments, customer
    migration and data import, orders, and platform healthcheck. Calling the
    endpoints themselves requires a bearer token from the Kraken authorisation
    server.
  humanURL: https://developer.origin-kraken.energy/rest/
  baseURL: https://api.origin-kraken.energy/v1
