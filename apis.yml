- aid: origin-energy:origin-energy-cdr-discovery-api
  name: Origin Energy CDR Public Discovery API
  description: >-
    The unauthenticated portion of Origin Energy's Consumer Data Right surface,
    published as the brand's publicBaseUri on the CDR Register. Verified
    anonymously on 2026-07-27 — GET /cds-au/v1/discovery/status returned HTTP
    200 with a Consumer Data Standards conformant payload
    ({"data":{"status":"OK", ...}}) and GET /cds-au/v1/discovery/outages
    returned HTTP 200 with an empty outages list. Both require the x-v version
    header. This is the only Origin-hosted API surface reachable without
    credentials, and it carries operational metadata only — no consumer or
    market data.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#discovery-apis
