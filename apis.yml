- aid: origin-energy:origin-energy-kraken-graphql-api
  name: Origin Energy Kraken GraphQL API
  description: >-
    The primary Kraken platform API for Origin Energy accounts, agreements,
    meter points, readings, payments, quotes and devices. Served at
    https://api.origin-kraken.energy/v1/graphql/ with a browser GraphQL IDE at
    the same URL. Verified on 2026-07-27 — an anonymous POST with the query
    {__schema{queryType{name}}} returned HTTP 200 and introspection is enabled,
    while data queries return the KT-CT-1112 AUTHORIZATION error until a bearer
    token is supplied. The documented usage constraints are a per-request
    complexity limit of 550 and an hourly points allowance, with cursor
    pagination capped at first=100.
  humanURL: https://developer.origin-kraken.energy/graphql/
  baseURL: https://api.origin-kraken.energy/v1/graphql/
